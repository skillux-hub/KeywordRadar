app = "seo-keyword-radar"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "4317"
  NODE_ENV = "production"

[http_service]
  internal_port = 4317
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[mounts]]
  source = "radar_data"
  destination = "/data"
